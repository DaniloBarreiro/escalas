<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário de Escalas</title>
<style>
  :root{
    --ink:#152a30;
    --ink-soft:#4d6067;
    --line:#e2ddd0;
    --page:#faf7f0;
    --card:#ffffff;
    --work-bg:#3E7C74;
    --work-text:#f4faf8;
    --folga-bg:#F4EEDD;
    --folga-text:#5b5540;
    --holiday-ring:#a13d2f;
    --facultativo-ring:#c98a3d;
    --accent:#c96a3f;
    --today-ring:#1d9e75;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--page);
    color:var(--ink);
    padding:clamp(16px,4vw,32px) clamp(12px,4vw,16px) 64px;
  }
  .wrap{max-width:900px;margin:0 auto;}
  header h1{
    font-size:clamp(22px,5vw,28px);
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  header p{
    margin:0 0 20px;
    color:var(--ink-soft);
    font-size:clamp(13px,3.4vw,15px);
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:clamp(14px,4vw,24px);
    margin-bottom:16px;
    overflow:hidden;
  }
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:flex-end;
    margin-bottom:18px;
  }
  .field{flex:1 1 200px;min-width:0;}
  .field label{
    display:block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.06em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  select{
    appearance:none;
    background:var(--page);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 36px 11px 14px;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    width:100%;
    max-width:100%;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%234d6067' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
    cursor:pointer;
  }
  .nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex:1 1 100%;
    order:3;
  }
  .nav button{
    border:1px solid var(--line);
    background:var(--page);
    border-radius:10px;
    width:42px;
    height:42px;
    min-width:42px;
    font-size:16px;
    cursor:pointer;
    color:var(--ink);
    flex-shrink:0;
    touch-action:manipulation;
  }
  .nav button:hover{background:#f0ebdc;}
  .nav button:disabled{cursor:not-allowed;}
  .nav .today-btn{
    width:auto;
    padding:0 16px;
    font-weight:700;
    font-size:13px;
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .month-label{
    font-size:16px;
    font-weight:700;
    flex:1 1 auto;
    text-align:center;
    min-width:0;
  }
  .legend{
    display:flex;
    gap:14px 20px;
    flex-wrap:wrap;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:16px;
  }
  .legend span{display:inline-flex;align-items:center;gap:8px;}
  .swatch{width:14px;height:14px;border-radius:5px;display:inline-block;flex-shrink:0;position:relative;}
  .sw-work{background:var(--work-bg);}
  .sw-folga{background:var(--folga-bg);border:1px solid var(--line);}
  .sw-holiday{background:var(--folga-bg);border:2px solid var(--holiday-ring);}
  .sw-holiday::after{
    content:'';
    position:absolute;
    top:-3px; right:-3px;
    width:7px; height:7px;
    border-radius:50%;
    background:var(--holiday-ring);
    box-shadow:0 0 0 1.5px #fff;
  }
  .sw-facultativo{background:var(--folga-bg);border:2px dashed var(--facultativo-ring);}
  .sw-facultativo::after{
    content:'';
    position:absolute;
    top:-3px; right:-3px;
    width:7px; height:7px;
    border-radius:50%;
    background:#fff;
    border:2px solid var(--facultativo-ring);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:clamp(3px,1vw,6px);
  }
  .dow{
    text-align:center;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--ink-soft);
    padding-bottom:6px;
  }
  .day{
    min-height:clamp(48px,13vw,78px);
    border-radius:8px;
    padding:clamp(4px,1.6vw,8px);
    font-size:12px;
    position:relative;
    min-width:0;
    overflow:hidden;
  }
  .day.empty{background:transparent;}
  .day.work{background:var(--work-bg);color:var(--work-text);}
  .day.folga{background:var(--folga-bg);color:var(--folga-text);}
  .day.inactive{background:#f4f2ec;color:var(--ink-soft);}
  .day.inactive .status{opacity:.7;}
  .day .num{font-size:clamp(11px,3vw,14px);font-weight:700;margin-bottom:2px;display:block;}
  .day .status{font-size:9px;line-height:1.3;opacity:.92;word-break:break-word;}
  .day.holiday{box-shadow:0 0 0 2px var(--holiday-ring) inset;}
  .day.holiday.facultativo{box-shadow:none;border:2px dashed var(--facultativo-ring);}
  .day.holiday::after{
    content:'';
    position:absolute;
    top:6px; right:6px;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--holiday-ring);
    box-shadow:0 0 0 2px rgba(255,255,255,0.55);
  }
  .day.holiday.facultativo::after{
    background:transparent;
    border:2px solid var(--facultativo-ring);
    box-shadow:none;
  }
  .day.today .num{
    display:inline-block;
    background:var(--today-ring);
    color:#fff;
    border-radius:6px;
    padding:0 6px;
  }
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:18px;
  }
  .stat{
    background:var(--page);
    border-radius:12px;
    padding:12px 8px;
    text-align:center;
    min-width:0;
  }
  .stat .val{font-size:clamp(18px,4.5vw,24px);font-weight:800;}
  .stat .lbl{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
  .cycle-note{
    margin-top:14px;
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .holidays-title{
    font-size:15px;
    font-weight:700;
    margin:0 0 12px;
  }
  .holiday-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px 10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .holiday-row:last-child{border-bottom:none;}
  .holiday-date{
    width:44px;
    font-weight:700;
    color:var(--holiday-ring);
    flex-shrink:0;
  }
  .holiday-name{flex:1 1 140px;min-width:0;}
  .badge{
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:3px 8px;
    border-radius:20px;
    flex-shrink:0;
  }
  .badge.Nacional{background:#e6f1fb;color:#0c447c;}
  .badge.Estadual{background:#eaf3de;color:#27500a;}
  .badge.Municipal{background:#faece7;color:#712b13;}
  .badge.Facultativo{background:#f1efe8;color:#444441;}
  .badge.multi{background:#fbeaf0;color:#72243e;}
  .empty-note{color:var(--ink-soft);font-size:13px;}
  .download-btn{
    display:block;
    width:100%;
    margin-top:16px;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--page);
    color:var(--ink);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .download-btn:hover{background:#f0ebdc;}
  .download-btn:active{transform:scale(0.99);}

  @media(max-width:640px){
    .day .status{display:none;}
    .day{min-height:44px;}
  }
  @media(max-width:420px){
    .stats{grid-template-columns:1fr 1fr 1fr;gap:6px;}
    .stat{padding:10px 4px;}
    .day{border-radius:6px;}
    .nav button{width:38px;height:38px;min-width:38px;}
    .month-label{font-size:14px;}
  }
  @media(min-width:641px){
    .field{flex:0 1 240px;}
    .nav{flex:0 1 auto;order:0;margin-left:auto;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Calendário de Escalas</h1>
    <p>Escolha o código da escala para ver os dias de trabalho e folga. Dias com borda vermelha são feriados.</p>
  </header>

  <div class="card">
    <div class="controls">
      <div class="field">
        <label for="scheduleSelect">Código da escala</label>
        <select id="scheduleSelect"></select>
      </div>
      <div class="nav">
        <button id="prevBtn" aria-label="Mês anterior">&#8592;</button>
        <div class="month-label" id="monthLabel"></div>
        <button id="nextBtn" aria-label="Próximo mês">&#8594;</button>
        <button class="today-btn" id="todayBtn">Hoje</button>
        <button class="today-btn" id="copyLinkBtn" title="Copiar link desta escala e mês">Copiar link</button>
      </div>
    </div>

    <div class="legend">
      <span><span class="swatch sw-work"></span>Trabalho</span>
      <span><span class="swatch sw-folga"></span>Folga</span>
      <span><span class="swatch sw-holiday"></span>Feriado</span>
      <span><span class="swatch sw-facultativo"></span>Ponto facultativo</span>
    </div>

    <div class="grid" id="dowRow"></div>
    <div class="grid" id="calGrid" style="margin-top:6px;"></div>

    <div class="stats">
      <div class="stat"><div class="val" id="statWork">0</div><div class="lbl">Dias de trabalho</div></div>
      <div class="stat"><div class="val" id="statFolga">0</div><div class="lbl">Folgas</div></div>
      <div class="stat"><div class="val" id="statHours">0</div><div class="lbl">Horas previstas</div></div>
    </div>

    <button id="downloadImgBtn" class="download-btn">Baixar imagem do mês</button>
  </div>

  <div class="card">
    <p class="holidays-title">Feriados do mês exibido</p>
    <div id="holidayList"></div>
  </div>
</div>

<script>
const CYCLE = [1,1,1,1,1,0, 1,1,1,1,1,0, 1,1,1,1,0,0, 1,1,1,0,0, 1,1,1,0,0];
const EPOCH = new Date(2026,0,1);
const START_LIMIT = new Date(2026,7,9);

function shiftLabel(turma){
  if(turma==='D') return '10:00–19:48';
  const starts = {A:'02:00', B:'03:00', C:'07:00'};
  const endMap = {A:'11:48', B:'12:48', C:'16:48'};
  return starts[turma] + '–' + endMap[turma];
}

const SCHEDULES = [
  {code:'A1 - 150/2656', short:'A1', offset:9,  turma:'A'},
  {code:'A2 - 150/2657', short:'A2', offset:2,  turma:'A'},
  {code:'A3 - 150/2658', short:'A3', offset:23, turma:'A'},
  {code:'A4 - 150/2659', short:'A4', offset:16, turma:'A'},
  {code:'B1 - 150/2660', short:'B1', offset:9,  turma:'B'},
  {code:'B2 - 150/2661', short:'B2', offset:2,  turma:'B'},
  {code:'B3 - 150/2662', short:'B3', offset:23, turma:'B'},
  {code:'B4 - 150/2663', short:'B4', offset:16, turma:'B'},
  {code:'C1 - 150/2664', short:'C1', offset:9,  turma:'C'},
  {code:'C2 - 150/2665', short:'C2', offset:2,  turma:'C'},
  {code:'C3 - 150/2666', short:'C3', offset:23, turma:'C'},
  {code:'C4 - 150/2667', short:'C4', offset:16, turma:'C'},
  {code:'D1 - 150/2412', short:'D1', offset:23, turma:'D'},
  {code:'D2 - 150/2413', short:'D2', offset:16, turma:'D'},
  {code:'D3 - 150/2414', short:'D3', offset:9,  turma:'D'},
  {code:'D4 - 150/2415', short:'D4', offset:2,  turma:'D'}
];

const HOLIDAYS = {
  '2026-01-01':{name:'Confraternização Universal', type:'Nacional'},
  '2026-02-16':{name:'Carnaval (segunda-feira, ponto facultativo)', type:'Facultativo'},
  '2026-02-17':{name:'Carnaval', type:'Nacional'},
  '2026-02-18':{name:'Quarta-feira de Cinzas (facultativo até 14h)', type:'Facultativo'},
  '2026-04-03':{name:'Sexta-feira Santa', type:'Nacional'},
  '2026-04-20':{name:'Aniversário de Caraguatatuba (169 anos)', type:'Municipal'},
  '2026-04-21':{name:'Tiradentes', type:'Nacional'},
  '2026-05-01':{name:'Dia do Trabalho', type:'Nacional'},
  '2026-06-04':{name:'Corpus Christi (facultativo)', type:'Facultativo'},
  '2026-06-13':{name:'Santo Antônio de Pádua', type:'Municipal'},
  '2026-07-09':{name:'Revolução Constitucionalista de 1932', type:'Estadual'},
  '2026-09-07':{name:'Independência do Brasil', type:'Nacional'},
  '2026-10-12':{name:'Nossa Senhora Aparecida', type:'Nacional'},
  '2026-11-02':{name:'Finados', type:'Nacional'},
  '2026-11-15':{name:'Proclamação da República', type:'Nacional'},
  '2026-11-20':{name:'Dia da Consciência Negra', type:'multi'},
  '2026-12-08':{name:'Nossa Senhora da Conceição (padroeira, facultativo)', type:'Municipal'},
  '2026-12-25':{name:'Natal', type:'Nacional'}
};

const DOW = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MIN_MONTH = new Date(2026,7,1);
const MAX_MONTH = new Date(2026,11,1);
const STORAGE_KEY = 'calendario_escalas_pref';

function clampMonth(d){
  if(d < MIN_MONTH) return new Date(MIN_MONTH);
  if(d > MAX_MONTH) return new Date(MAX_MONTH);
  return d;
}

// --- Determine initial state: URL params > localStorage > defaults ---
const params = new URLSearchParams(window.location.search);
let storedPref = {};
try{ storedPref = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }catch(e){ storedPref = {}; }

const urlEscala = params.get('escala');
const urlMes = params.get('mes'); // formato YYYY-MM

let initialIndex = 0;
const wantedShort = urlEscala || storedPref.escala;
if(wantedShort){
  const foundIdx = SCHEDULES.findIndex(s => s.short.toUpperCase() === String(wantedShort).toUpperCase());
  if(foundIdx >= 0) initialIndex = foundIdx;
}

let initialMonth = new Date(2026,7,1);
const wantedMes = urlMes || storedPref.mes;
if(wantedMes && /^\d{4}-\d{2}$/.test(wantedMes)){
  const [yy,mm] = wantedMes.split('-').map(Number);
  initialMonth = clampMonth(new Date(yy, mm-1, 1));
}

let current = initialMonth;
let today = new Date();

function isRealUrlContext(){
  return window.location.protocol === 'http:' || window.location.protocol === 'https:' || window.location.protocol === 'file:';
}

function savePreference(){
  const sched = SCHEDULES[select.value];
  const y = current.getFullYear();
  const m = String(current.getMonth()+1).padStart(2,'0');
  const pref = {escala:sched.short, mes:`${y}-${m}`};
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(pref)); }catch(e){}
  if(isRealUrlContext()){
    try{
      const newParams = new URLSearchParams();
      newParams.set('escala', sched.short);
      newParams.set('mes', pref.mes);
      const newUrl = window.location.pathname + '?' + newParams.toString();
      window.history.replaceState({}, '', newUrl);
    }catch(e){ /* ambiente restrito (ex.: pré-visualização em iframe) — ignora silenciosamente */ }
  }
}

const select = document.getElementById('scheduleSelect');
const groups = {};
SCHEDULES.forEach((s,i)=>{
  if(!groups[s.turma]){
    groups[s.turma] = document.createElement('optgroup');
    groups[s.turma].label = 'Turno ' + shiftLabel(s.turma);
    select.appendChild(groups[s.turma]);
  }
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = s.code;
  groups[s.turma].appendChild(opt);
});
select.value = initialIndex;
savePreference();

function toKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function isWork(date, offset){
  const days = Math.floor((new Date(date.getFullYear(),date.getMonth(),date.getDate()) - EPOCH) / 86400000);
  let idx = (days + offset) % 28;
  if(idx < 0) idx += 28;
  return CYCLE[idx] === 1;
}

function isSameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function render(){
  const sched = SCHEDULES[select.value];
  const offset = sched.offset;
  const label = shiftLabel(sched.turma);
  const y = current.getFullYear();
  const m = current.getMonth();
  document.getElementById('monthLabel').textContent = MONTHS[m] + ' ' + y;
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const atMin = (y===MIN_MONTH.getFullYear() && m===MIN_MONTH.getMonth());
  const atMax = (y===MAX_MONTH.getFullYear() && m===MAX_MONTH.getMonth());
  prevBtn.disabled = atMin;
  prevBtn.style.opacity = atMin ? '0.35' : '1';
  prevBtn.style.cursor = atMin ? 'not-allowed' : 'pointer';
  nextBtn.disabled = atMax;
  nextBtn.style.opacity = atMax ? '0.35' : '1';
  nextBtn.style.cursor = atMax ? 'not-allowed' : 'pointer';

  const dowRow = document.getElementById('dowRow');
  dowRow.innerHTML = '';
  DOW.forEach(d=>{
    const el = document.createElement('div');
    el.className='dow';
    el.textContent=d;
    dowRow.appendChild(el);
  });

  const grid = document.getElementById('calGrid');
  grid.innerHTML='';
  const firstDay = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();

  for(let i=0;i<firstDay;i++){
    const el = document.createElement('div');
    el.className='day empty';
    grid.appendChild(el);
  }

  let workCount=0, folgaCount=0;
  const monthHolidays=[];

  for(let d=1; d<=daysInMonth; d++){
    const date = new Date(y,m,d);
    const active = date >= START_LIMIT;
    const work = active ? isWork(date, offset) : false;
    if(active){ if(work) workCount++; else folgaCount++; }

    const key = toKey(date);
    const holiday = active ? HOLIDAYS[key] : null;
    if(holiday) monthHolidays.push({day:d, key, ...holiday});

    const el = document.createElement('div');
    el.className = 'day ' + (!active ? 'inactive' : (work?'work':'folga')) + (holiday?' holiday':'') + (holiday && holiday.type==='Facultativo' ? ' facultativo' : '') + (isSameDay(date,today)?' today':'');
    const num = document.createElement('span');
    num.className='num';
    num.textContent = d;
    const status = document.createElement('span');
    status.className='status';
    status.textContent = !active ? 'Sem escala' : (work ? label : 'Folga');
    el.appendChild(num);
    el.appendChild(status);
    grid.appendChild(el);
  }

  document.getElementById('statWork').textContent = workCount;
  document.getElementById('statFolga').textContent = folgaCount;
  document.getElementById('statHours').textContent = (workCount*8.8).toFixed(1).replace('.',',') + ' h';

  const listEl = document.getElementById('holidayList');
  listEl.innerHTML='';
  if(monthHolidays.length===0){
    const p = document.createElement('p');
    p.className='empty-note';
    p.textContent='Nenhum feriado nacional, estadual ou municipal (Caraguatatuba) neste mês.';
    listEl.appendChild(p);
  } else {
    monthHolidays.forEach(h=>{
      const row = document.createElement('div');
      row.className='holiday-row';
      const dt = document.createElement('div');
      dt.className='holiday-date';
      dt.textContent = String(h.day).padStart(2,'0')+'/'+String(m+1).padStart(2,'0');
      const nm = document.createElement('div');
      nm.className='holiday-name';
      nm.textContent = h.name;
      const badge = document.createElement('span');
      badge.className='badge '+h.type;
      badge.textContent = h.type==='multi' ? 'Nac / Est / Mun' : h.type;
      row.appendChild(dt);
      row.appendChild(nm);
      row.appendChild(badge);
      listEl.appendChild(row);
    });
  }
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  const target = new Date(current.getFullYear(), current.getMonth()-1, 1);
  if(target < MIN_MONTH) return;
  current = target;
  savePreference();
  render();
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  const target = new Date(current.getFullYear(), current.getMonth()+1, 1);
  if(target > MAX_MONTH) return;
  current = target;
  savePreference();
  render();
});
document.getElementById('todayBtn').addEventListener('click', ()=>{
  let target = new Date(today.getFullYear(), today.getMonth(), 1);
  if(target < MIN_MONTH) target = MIN_MONTH;
  if(target > MAX_MONTH) target = MAX_MONTH;
  current = target;
  savePreference();
  render();
});
function exportMonthImage(){
  const sched = SCHEDULES[select.value];
  const y = current.getFullYear();
  const m = current.getMonth();
  const firstDay = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const totalCells = firstDay + daysInMonth;
  const rows = Math.ceil(totalCells/7);

  const scale = 2; // resolução mais nítida
  const W = 760, headerH = 96, dowH = 28, cellW = W/7, cellH = 78;
  const footerH = 60;
  const H = headerH + dowH + rows*cellH + footerH;

  const canvas = document.createElement('canvas');
  canvas.width = W*scale;
  canvas.height = H*scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);

  const COL = {
    page:'#faf7f0', ink:'#152a30', inkSoft:'#4d6067', line:'#e2ddd0',
    work:'#3E7C74', workText:'#f4faf8', folga:'#F4EEDD', folgaText:'#5b5540',
    inactive:'#f4f2ec', holiday:'#a13d2f', facultativo:'#c98a3d'
  };

  ctx.fillStyle = COL.page;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = COL.ink;
  ctx.font = '700 22px -apple-system, Segoe UI, Roboto, Arial, sans-serif';
  ctx.fillText('Calendário de Escalas', 24, 36);

  ctx.font = '600 16px -apple-system, Segoe UI, Roboto, Arial, sans-serif';
  ctx.fillStyle = COL.inkSoft;
  ctx.fillText(sched.code + '  •  ' + MONTHS[m] + ' ' + y, 24, 62);

  ctx.font = '700 11px -apple-system, Segoe UI, Roboto, Arial, sans-serif';
  DOW.forEach((d,i)=>{
    ctx.fillStyle = COL.inkSoft;
    ctx.textAlign='center';
    ctx.fillText(d, i*cellW + cellW/2, headerH + 18);
  });
  ctx.textAlign='left';

  let workCount=0, folgaCount=0;
  let col=firstDay, row=0;
  for(let d=1; d<=daysInMonth; d++){
    const date = new Date(y,m,d);
    const active = date >= START_LIMIT;
    const work = active ? isWork(date, sched.offset) : false;
    if(active){ if(work) workCount++; else folgaCount++; }
    const holiday = active ? HOLIDAYS[toKey(date)] : null;

    const x = col*cellW, yy = headerH+dowH + row*cellH;
    const bg = !active ? COL.inactive : (work ? COL.work : COL.folga);
    ctx.fillStyle = bg;
    roundRect(ctx, x+2, yy+2, cellW-4, cellH-4, 8);
    ctx.fill();

    if(holiday){
      ctx.lineWidth = 2;
      ctx.strokeStyle = holiday.type==='Facultativo' ? COL.facultativo : COL.holiday;
      if(holiday.type==='Facultativo') ctx.setLineDash([4,3]); else ctx.setLineDash([]);
      roundRect(ctx, x+3, yy+3, cellW-6, cellH-6, 7);
      ctx.stroke();
      ctx.setLineDash([]);

      // ponto no canto: preenchido = feriado obrigatório, vazado = facultativo
      const dotX = x+cellW-12, dotY = yy+12;
      ctx.beginPath();
      ctx.arc(dotX, dotY, 4.5, 0, Math.PI*2);
      if(holiday.type==='Facultativo'){
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = COL.facultativo;
        ctx.stroke();
      } else {
        ctx.fillStyle = COL.holiday;
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#fff';
        ctx.stroke();
      }
    }

    ctx.fillStyle = !active ? COL.inkSoft : (work ? COL.workText : COL.folgaText);
    ctx.font = '700 14px -apple-system, Segoe UI, Roboto, Arial, sans-serif';
    ctx.fillText(String(d), x+10, yy+22);
    ctx.font = '400 9.5px -apple-system, Segoe UI, Roboto, Arial, sans-serif';
    const label = !active ? 'Sem escala' : (work ? shiftLabel(sched.turma) : 'Folga');
    wrapText(ctx, label, x+10, yy+38, cellW-18, 11);

    col++;
    if(col>6){ col=0; row++; }
  }

  ctx.fillStyle = COL.line;
  ctx.fillRect(24, headerH+dowH+rows*cellH+16, W-48, 1);

  ctx.font = '700 13px -apple-system, Segoe UI, Roboto, Arial, sans-serif';
  ctx.fillStyle = COL.ink;
  const hours = (workCount*8.8).toFixed(1).replace('.',',');
  const summaryY = headerH+dowH+rows*cellH+40;
  ctx.fillText(`${workCount} dias de trabalho`, 24, summaryY);
  ctx.fillText(`${folgaCount} folgas`, 260, summaryY);
  ctx.fillText(`${hours} h previstas`, 440, summaryY);

  canvas.toBlob(blob=>{
    const link = document.createElement('a');
    const monthSlug = MONTHS[m].toLowerCase();
    link.download = `escala_${sched.short}_${monthSlug}_${y}.png`;
    link.href = URL.createObjectURL(blob);
    link.click();
    setTimeout(()=>URL.revokeObjectURL(link.href), 4000);
  }, 'image/png');
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  let curY = y;
  for(let i=0;i<words.length;i++){
    const test = line + words[i] + ' ';
    if(ctx.measureText(test).width > maxWidth && line !== ''){
      ctx.fillText(line, x, curY);
      line = words[i] + ' ';
      curY += lineHeight;
    } else {
      line = test;
    }
  }
  ctx.fillText(line, x, curY);
}

document.getElementById('downloadImgBtn').addEventListener('click', exportMonthImage);

select.addEventListener('change', ()=>{ savePreference(); render(); });

// Atualiza o destaque de "hoje" automaticamente quando o dia virar,
// mesmo que a aba fique aberta passando da meia-noite.
setInterval(()=>{
  const now = new Date();
  if(!isSameDay(now, today)){
    today = now;
    render();
  }
}, 60000);

document.getElementById('copyLinkBtn').addEventListener('click', ()=>{
  savePreference();
  const btn = document.getElementById('copyLinkBtn');
  const restore = ()=>{ btn.textContent = 'Copiar link'; };

  if(!isRealUrlContext()){
    btn.textContent = 'Indisponível aqui';
    setTimeout(restore, 2200);
    return;
  }

  const url = window.location.href;
  navigator.clipboard.writeText(url).then(()=>{
    btn.textContent = 'Link copiado!';
    setTimeout(restore, 1800);
  }).catch(()=>{
    window.prompt('Copie o link abaixo:', url);
  });
});

render();
</script>
